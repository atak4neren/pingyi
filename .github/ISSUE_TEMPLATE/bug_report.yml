name: Bug report
description: Report a reproducible problem in PingYi
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Never attach screenshots, OCR text, translations, API keys, tokens, or credentials that contain private data.
  - type: input
    id: version
    attributes:
      label: PingYi version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11 x64
        - Windows 10 x64
        - Ubuntu X11 x64
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem without including private content.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open PingYi
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostics
      description: Include error codes and provider names only. Remove text, images, file paths, keys, and tokens.
